mobilecar_navigation_bridge:
  ros__parameters:
    use_sim_time: true
    socket_path: ../../var/ipc/g3a_navigation.sock
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser_frame
    imu_frame: imu_link
    command_topic: /mobilecar/cmd_vel_nav_test
    health_topic: /mobilecar/navigation_health
    command_timeout_s: 0.25
    command_lease_ttl_s: 0.35
    command_session_id: g3a_ros_bridge
    publish_tf: true
    publish_static_tf: true
    max_command_translation_m_s: 0.05
    max_command_yaw_rad_s: 0.30
    sensor_qos_depth: 5
    tf_qos_depth: 30
    t_base_laser: [0.07302117405202284, 0.0, 0.08]
    q_base_laser_xyzw: [0.0, 0.0, 0.0, 1.0]
    t_base_imu: [0.0, 0.0, 0.035]
    q_base_imu_xyzw: [0.0, 0.0, 0.0, 1.0]
