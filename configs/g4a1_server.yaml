  model_path: assets/landerpi/model/robot.xml
  scene_path: assets/landerpi/scenes/mobile_pick.xml
  observation_profile_path: configs/profiles/g4a1_observation_v1.yaml
  g4a1:
    enabled: true
    interface_profile: g4a1-1.0
    observation_profile_path: configs/profiles/g4a1_observation_v1.yaml
